description: Apps and engines loaded when an Asset is loaded. Workfiles2 lets
  artists choose a task and load associated content. Most publishing work
  happens in asset_step. DCCs limited to the buffalo_vfx stack.

################################################################################

includes:
- ./includes/frameworks.yml
- ./includes/settings/tk-maya.yml
- ./includes/settings/tk-nuke.yml
- ./includes/settings/tk-shell.yml
- ./includes/settings/tk-shotgun.yml

################################################################################
# configuration for all engines to load in an asset context

engines:
  tk-maya:    "@settings.tk-maya.asset"
  tk-nuke:    "@settings.tk-nuke.asset"
  tk-shell:   "@settings.tk-shell.asset"
  tk-shotgun: "@settings.tk-shotgun.asset"

################################################################################
# reference all of the common frameworks

frameworks: "@frameworks"
