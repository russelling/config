# Software path configuration. Typically consumed by the launchapp
# configurations for software that is not auto-discovered

################################################################################

# Mari
path.linux.mari: "/usr/local/Mari7.5v2/mari"
path.windows.mari: C:\Program Files\Mari7.5v2\Bundle\bin\Mari7.5v2.exe

# Blender
# path.windows.blender uses a {version} token, consumed only by the
# Windows-only settings.tk-multi-launchapp.blender_windows instance (see
# tk-multi-launchapp.yml) so 5.x releases register as separate launch icons
# without a config change per install -- matches the real per-version folder
# naming Blender's Windows installer uses ("Blender 5.2", not
# "blender 5.2.0"). mac_path/linux_path stay fixed single paths, used by the
# separate plain settings.tk-multi-launchapp.blender instance (see that
# file's comments for why the two are split, and why mac_path can't just
# move to the tk-blender engine's own auto-discovery instead -- its built-in
# templates don't cover the real macOS install location).
path.linux.blender: "/usr/bin/blender"
path.mac.blender: "/Applications/Blender.app/Contents/MacOS/Blender"
path.windows.blender: C:\Program Files\Blender Foundation\Blender {version}\blender.exe

# Motionbuilder
path.windows.motionbuilder: C:\Program Files\Autodesk\MotionBuilder 2027\bin\x64\motionbuilder.exe

# Hiero
path.linux.hiero: "/usr/local/Nuke17.0v1/Nuke17.0"
path.mac.hiero: "/Applications/Nuke17.0v1/Hiero17.0v1.app"
path.windows.hiero: C:\Program Files\Nuke17.0v1\Nuke17.0.exe

# RV
path.linux.rv: "rv"
path.mac.rv: "/Applications/RV.app"
path.windows.rv: C:\Program Files\Shotgun\RV-7.9.0\bin\rv.exe

# Unreal Engine
# NOTE: Unreal Engine does not support macOS - Windows only.
# mac_path left as placeholder to satisfy YAML parser; it will never be invoked.
path.linux.unreal: "/opt/UnrealEngine/Engine/Binaries/Linux/UnrealEditor"
path.mac.unreal: "/dev/null"
path.windows.unreal: C:\Program Files\Epic Games\UE_5.7\Engine\Binaries\Win64\UnrealEditor.exe
