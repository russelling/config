# Buffalo VFX - tk-multi-publish2 settings for Unreal

includes:
- ../../app_locations.yml

# -- Unreal project-level publish ------------------------------------------
settings.tk-multi-publish2.unreal.project:
  collector: "{self}/collector.py:{engine}/tk-multi-publish2/basic/collector.py"
  publish_plugins:
  - name: Publish to Flow Production Tracking
    hook: "{self}/publish_file.py"
    settings: {}
  - name: Upload for review
    hook: "{self}/upload_version.py"
    settings: {}
  - name: Publish to Flow Production Tracking
    hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/publish_session.py"
    settings: {}
  - name: Export FBX and Publish to Flow Production Tracking
    hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/publish_asset.py"
    settings:
        Publish Template: unreal.asset_publish
  - name: Render Movie and Submit for Review
    hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/publish_movie.py"
    settings:
        Publish Template: unreal.movie_publish
  help_url: "https://help.autodesk.com/view/SGSUB/ENU/?guid=SG_Supervisor_Artist_sa_integrations_sa_integrations_user_guide_html#the-publisher"
  location: "@apps.tk-multi-publish2.location"

