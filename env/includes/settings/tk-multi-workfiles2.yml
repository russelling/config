################################################################################

includes:
- ../app_locations.yml

################################################################################

# Base entity browser - used at transit/project levels where no templates are needed.
# fields: entries ensure sg_episode and sg_scene are fetched for hierarchy grouping.

settings.tk-multi-workfiles2: &settings_tk-multi-workfiles2
  entities:
  - caption: Assets
    entity_type: Asset
    hierarchy: [sg_asset_type, code]
    filters:
    sub_hierarchy:
      entity_type: Task
      filters:
      link_field: entity
      hierarchy: [step]
  - caption: Shots
    entity_type: Shot
    filters:
    hierarchy: [code]
    sub_hierarchy:
      entity_type: Task
      filters:
      link_field: entity
      hierarchy: [step]
  location: "@apps.tk-multi-workfiles2.location"

# launches at startup.
settings.tk-multi-workfiles2.launch_at_startup:
  launch_at_startup: true
  entities:
  - caption: Assets
    entity_type: Asset
    hierarchy: [sg_asset_type, code]
    filters:
    sub_hierarchy:
      entity_type: Task
      filters:
      link_field: entity
      hierarchy: [step]
  - caption: Shots
    entity_type: Shot
    filters:
    hierarchy: [code]
    sub_hierarchy:
      entity_type: Task
      filters:
      link_field: entity
      hierarchy: [step]
  location: "@apps.tk-multi-workfiles2.location"

################################################################################

# ---- hiero/nukestudio

settings.tk-multi-workfiles2.hiero:
  entities:
  - caption: Projects
    entity_type: Project
    filters: []
    hierarchy: [name]
  show_my_tasks: false
  template_publish: hiero_project_publish
  template_publish_area: hiero_project_publish_area
  template_work: hiero_project_work
  template_work_area: hiero_project_work_area
  location: "@apps.tk-multi-workfiles2.location"

